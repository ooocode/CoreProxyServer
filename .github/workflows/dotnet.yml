name: Build and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux-arm64:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Build ARM64
      run: |
        docker run --rm -v "${{ github.workspace }}:/w" -w /w debian:10 bash -c '
          sed -i "s|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g" /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y ca-certificates curl zip libicu-dev clang gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 11.0 --quality preview --install-dir /dotnet
          export PATH=/dotnet:$PATH
          dotnet publish CoreProxy.Server.Orleans -c Release -r linux-arm64 -p:PublishAot=true -p:CppCompilerAndLinker=clang -p:ObjCopyName=aarch64-linux-gnu-objcopy -o output-arm64
        '
    - run: sudo chown -R $(id -u):$(id -g) output-arm64
    - uses: actions/upload-artifact@v4
      with:
        name: arm64
        path: output-arm64

  build-linux-x64:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - run: dotnet publish CoreProxy.Server.Orleans -c Release -r linux-x64 -p:PublishAot=true -o output-x64
    - uses: actions/upload-artifact@v4
      with:
        name: x64
        path: output-x64

  release:
    needs: [build-linux-arm64, build-linux-x64]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: arm64
        path: arm64
    - uses: actions/download-artifact@v4
      with:
        name: x64
        path: x64
    - run: |
        cd arm64 && zip -r ../linux-arm64.zip . && cd ..
        cd x64 && zip -r ../linux-x64.zip . && cd ..
    - uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        automatic_release_tag: latest
        files: |
          linux-arm64.zip
          linux-x64.zip