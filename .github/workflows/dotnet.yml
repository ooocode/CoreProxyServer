# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Restore dependencies
      run: dotnet restore CoreProxy.Server.Orleans
    - name: Publish linux-x64
      run: dotnet publish CoreProxy.Server.Orleans -c Release -r linux-x64
    - name: Publish linux-arm64 with GLIBC 2.28
      run: |
        docker run --rm \
          -v "${{ github.workspace }}:/src" \
          -w /src \
          debian:10 \
          bash -euxo pipefail -c '
            sed -i "s|deb.debian.org/debian|archive.debian.org/debian|g; s|security.debian.org/debian-security|archive.debian.org/debian-security|g" /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y --no-install-recommends ca-certificates curl clang gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
            curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
            bash /tmp/dotnet-install.sh --channel 11.0 --quality preview --install-dir /dotnet
            export PATH=/dotnet:$PATH
            dotnet publish CoreProxy.Server.Orleans -c Release -r linux-arm64 -p:CppCompilerAndLinker=clang -p:ObjCopyName=aarch64-linux-gnu-objcopy
          '
    - name: Zip
      run: |
        cd ${{ github.workspace }}/CoreProxy.Server.Orleans/bin/Release/net11.0/linux-x64
        zip -r publish-linux-x64.zip publish
        cd ${{ github.workspace }}/CoreProxy.Server.Orleans/bin/Release/net11.0/linux-arm64
        zip -r publish-linux-arm64.zip publish
    - name: Create GitHub release
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        automatic_release_tag: latest
        prerelease: false
        title: latest
        files: |
          ${{ github.workspace }}/CoreProxy.Server.Orleans/bin/Release/net11.0/linux-x64/publish-linux-x64.zip
          ${{ github.workspace }}/CoreProxy.Server.Orleans/bin/Release/net11.0/linux-arm64/publish-linux-arm64.zip

