<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活跃隧道</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #1c1e21;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e4e6eb; }
    table { background: #1e2126; }
    th { background: #24272e; }
    tr + tr td { border-top-color: #2b2f36; }
    .muted { color: #9aa0a6; }
    button { background: #2b2f36; color: #e4e6eb; border-color: #3a3f47; }
  }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h2 { font-size: 16px; margin: 30px 0 12px; font-weight: 600; }
  .count { font-size: 15px; }
  .count b { font-size: 22px; }
  .muted { color: #6b7280; font-size: 13px; }
  .spacer { flex: 1; }
  button {
    padding: 6px 14px; font-size: 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid #d0d5dd; background: #fff; color: #1c1e21;
  }
  button:hover { border-color: #98a2b3; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  th, td { padding: 10px 14px; text-align: left; font-size: 14px; }
  th { background: #f0f2f5; font-weight: 600; font-size: 13px; letter-spacing: .02em; }
  tr + tr td { border-top: 1px solid #eceef1; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .empty { padding: 40px; text-align: center; }
  .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; display: none; }
  .banner.show { display: block; }
  .banner.warn { background: #fff4e5; color: #8a5300; }
  @media (prefers-color-scheme: dark) { .banner.warn { background: #3a2c12; color: #f0c07a; } }

  /* 可调用方法标签 */
  .chip {
    display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0; border-radius: 10px;
    font-size: 12px; background: #e8f0fe; color: #1a56db;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) { .chip { background: #24305c; color: #a8c2ff; } }

  /* 调用面板 */
  .panel {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;
    background: #fff; padding: 16px; border-radius: 8px;
  }
  @media (prefers-color-scheme: dark) { .panel { background: #1e2126; } }
  .panel label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #6b7280; }
  @media (prefers-color-scheme: dark) { .panel label { color: #9aa0a6; } }
  .panel select, .panel input {
    padding: 7px 9px; font-size: 14px; border-radius: 6px;
    border: 1px solid #d0d5dd; background: #fff; color: #1c1e21; min-width: 190px;
    font-family: inherit;
  }
  @media (prefers-color-scheme: dark) {
    .panel select, .panel input { background: #16181c; color: #e4e6eb; border-color: #3a3f47; }
  }
  .panel select:disabled, .panel input:disabled { opacity: .5; }

  /* 调用结果 */
  .result {
    margin-top: 12px; padding: 12px 14px; border-radius: 6px; font-size: 14px;
    display: none; white-space: pre-wrap; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  .result.show { display: block; }
  .result.ok { background: #e7f6ec; color: #116329; }
  .result.err { background: #fdeaea; color: #a02622; }
  @media (prefers-color-scheme: dark) {
    .result.ok { background: #12301c; color: #7ee2a0; }
    .result.err { background: #3a1a1a; color: #f5a3a0; }
  }
</style>
</head>
<body>
  <header>
    <h1>活跃隧道</h1>
    <div class="count">活跃连接：<b id="total">0</b></div>
    <div class="spacer"></div>
    <span class="muted" id="updated"></span>
    <button id="refresh" type="button">刷新</button>
  </header>

  <div class="banner warn" id="banner"></div>

  <table>
    <thead>
      <tr><th>客户端 IP</th><th>目标地址</th><th>已运行时长</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty muted" id="empty">暂无活动隧道</div>

  <h2>在线设备 / 可调用方法</h2>
  <table>
    <thead>
      <tr><th>设备 ID</th><th>连接 ID</th><th>机器名</th><th>用户名</th><th>可调用方法</th><th>操作</th></tr>
    </thead>
    <tbody id="deviceRows"></tbody>
  </table>
  <div class="empty muted" id="deviceEmpty">暂无在线设备</div>

  <h2>调用设备方法</h2>
  <div class="panel">
    <label>设备
      <select id="invDevice"></select>
    </label>
    <label>方法
      <select id="invMethod"></select>
    </label>
    <label>payload
      <input id="invPayload" type="text" placeholder="传给方法的字符串参数（可空）">
    </label>
    <button id="invoke" type="button">调用</button>
  </div>
  <div class="result" id="invResult"></div>

<script>
(function () {
  var rowsEl = document.getElementById('rows');
  var totalEl = document.getElementById('total');
  var emptyEl = document.getElementById('empty');
  var updatedEl = document.getElementById('updated');
  var bannerEl = document.getElementById('banner');

  var deviceRowsEl = document.getElementById('deviceRows');
  var deviceEmptyEl = document.getElementById('deviceEmpty');
  var invDeviceEl = document.getElementById('invDevice');
  var invMethodEl = document.getElementById('invMethod');
  var invPayloadEl = document.getElementById('invPayload');
  var invResultEl = document.getElementById('invResult');

  // 最近一次拉到的数据；时长由本地每秒重算，不在轮询间重取
  var items = [];
  var devices = [];

  function formatDuration(ms) {
    if (!isFinite(ms) || ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600);
    var m = Math.floor((s % 3600) / 60);
    var sec = s % 60;
    if (h > 0) return h + 'h ' + m + 'm';
    if (m > 0) return m + 'm ' + sec + 's';
    return sec + 's';
  }

  function td(text, mono) {
    var el = document.createElement('td');
    if (mono) el.className = 'mono';
    el.textContent = text;
    return el;
  }

  function renderRows() {
    rowsEl.textContent = '';
    var now = Date.now();
    items.forEach(function (item) {
      var tr = document.createElement('tr');
      tr.appendChild(td(item.clientIp, true));
      tr.appendChild(td(item.target, true));

      var tdAge = document.createElement('td');
      var started = Date.parse(item.startedAt);
      tdAge.textContent = isNaN(started) ? '—' : formatDuration(now - started);
      tr.appendChild(tdAge);

      rowsEl.appendChild(tr);
    });
    emptyEl.style.display = items.length === 0 ? 'block' : 'none';
  }

  function renderDevices() {
    deviceRowsEl.textContent = '';
    devices.forEach(function (d) {
      var tr = document.createElement('tr');
      tr.appendChild(td(d.deviceId, true));
      // 同一 deviceId 允许多条连接，必须把 connectionId 展示出来才能区分这些行
      tr.appendChild(td(d.connectionId || '—', true));
      tr.appendChild(td(d.machineName || '—'));
      tr.appendChild(td(d.userName || '—'));

      // 可调用方法：标签形式；没上报任何方法时明确标注（这条连接不会成为任何调用的候选）
      var tdMethods = document.createElement('td');
      if (d.methods && d.methods.length) {
        d.methods.forEach(function (m) {
          var span = document.createElement('span');
          span.className = 'chip';
          span.textContent = m;
          tdMethods.appendChild(span);
        });
      } else {
        var none = document.createElement('span');
        none.className = 'muted';
        none.textContent = '未上报方法';
        tdMethods.appendChild(none);
      }
      tr.appendChild(tdMethods);

      var tdAction = document.createElement('td');
      if (d.methods && d.methods.length) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = '调用';
        btn.addEventListener('click', function () { pickDevice(d.deviceId); });
        tdAction.appendChild(btn);
      } else {
        tdAction.appendChild(td('—', false));
      }
      tr.appendChild(tdAction);

      deviceRowsEl.appendChild(tr);
    });
    deviceEmptyEl.style.display = devices.length === 0 ? 'block' : 'none';
  }

  // 重填下拉框时保留当前选择，避免每 5 秒轮询把用户正在选的值冲掉
  function fillSelect(select, values, keep, placeholder) {
    var previous = keep && values.indexOf(select.value) >= 0 ? select.value : '';
    select.textContent = '';
    if (values.length === 0) {
      var opt = document.createElement('option');
      opt.value = '';
      opt.textContent = placeholder;
      select.appendChild(opt);
      select.disabled = true;
      return '';
    }
    select.disabled = false;
    values.forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      select.appendChild(opt);
    });
    select.value = previous || values[0];
    return select.value;
  }

  // 设备下拉框：第一项是"随机"（value 为空 = 不指定 deviceId，由服务端按方法选）。
  // 不能复用 fillSelect：它会把空值当成"未选择"并强制回落到第一台设备，随机项会被 5 秒轮询冲掉。
  function fillDeviceSelect() {
    // 同一 deviceId 可能有多条连接：下拉框按 deviceId 去重，括号里标出连接数。
    var counts = {};
    var ids = [];
    devices.forEach(function (d) {
      if (!counts[d.deviceId]) {
        counts[d.deviceId] = 0;
        ids.push(d.deviceId);
      }
      counts[d.deviceId]++;
    });
    var previous = invDeviceEl.value;
    invDeviceEl.textContent = '';

    if (ids.length === 0) {
      var empty = document.createElement('option');
      empty.value = '';
      empty.textContent = '无在线设备';
      invDeviceEl.appendChild(empty);
      invDeviceEl.disabled = true;
      return '';
    }

    invDeviceEl.disabled = false;
    var random = document.createElement('option');
    random.value = '';
    random.textContent = '随机（按方法自动选择）';
    invDeviceEl.appendChild(random);
    ids.forEach(function (id) {
      var opt = document.createElement('option');
      opt.value = id;
      opt.textContent = counts[id] > 1 ? id + '（' + counts[id] + ' 条连接）' : id;
      invDeviceEl.appendChild(opt);
    });

    // 之前选的是随机（''）就保持随机；选的是设备且仍在线就保持该设备；掉线则回落到随机。
    invDeviceEl.value = ids.indexOf(previous) >= 0 ? previous : '';
    return invDeviceEl.value;
  }

  function syncPanel() {
    syncMethods(fillDeviceSelect());
  }

  function syncMethods(deviceId) {
    // 指定设备时，取该 deviceId 下【所有连接】上报方法的并集；随机模式取全部连接。
    // 大小写不敏感去重，保留首次出现的拼写。
    var methods = [];
    var seen = {};
    devices.forEach(function (d) {
      if (deviceId && d.deviceId !== deviceId) return;
      (d.methods || []).forEach(function (m) {
        var key = m.toLowerCase();
        if (!seen[key]) {
          seen[key] = true;
          methods.push(m);
        }
      });
    });
    methods.sort(function (a, b) { return a.localeCompare(b); });
    fillSelect(invMethodEl, methods, true, deviceId ? '无可调用方法' : '无设备上报方法');
  }

  function pickDevice(deviceId) {
    invDeviceEl.value = deviceId;
    syncMethods(deviceId);
    invPayloadEl.focus();
    invPayloadEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function showInvokeResult(ok, text) {
    invResultEl.textContent = text;
    invResultEl.className = 'result show ' + (ok ? 'ok' : 'err');
  }

  // 把 HTTP 状态码翻译成人话，和 AdminApi 的分层语义一一对应
  function explain(status) {
    switch (status) {
      case 401: return '未通过鉴权（401）：请刷新页面重新输入密码。';
      case 400: return '请求无效（400）：缺少 method。';
      case 404: return '没有可调用的目标（404）：指定的 deviceId 没有任何在线连接，或当前没有任何连接上报该方法。';
      case 409: return '设备未上报该方法（409）：指定 deviceId 时，该 ID 下的在线连接都没有主动声明支持该 method。';
      case 502: return '端上调用失败（502）：设备未实现该方法、已断开，或等待返回值超时。';
      default:  return '调用失败：HTTP ' + status;
    }
  }

  function invoke() {
    var deviceId = invDeviceEl.value;   // 空 = 随机模式
    var method = invMethodEl.value;
    if (!method) {
      showInvokeResult(false, '请先选择方法。');
      return;
    }

    invResultEl.className = 'result show';
    invResultEl.textContent = '调用中…';

    var body = { method: method, payload: invPayloadEl.value };
    if (deviceId) body.deviceId = deviceId;   // 不指定设备时不发 deviceId，交给服务端随机选

    fetch('/api/invoke', {
      method: 'POST',
      credentials: 'same-origin',
      cache: 'no-store',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (res) {
        return res.text().then(function (text) { return { status: res.status, text: text }; });
      })
      .then(function (r) {
        if (r.status === 200) {
          var payload = null;
          try { payload = JSON.parse(r.text); } catch (e) { /* 非 JSON 就原样展示 */ }
          if (payload) {
            // 必须展示实际承接调用的连接：同一 deviceId 可能有多条连接，只有 connectionId 能区分。
            showInvokeResult(true, '✓ ' + payload.deviceId + ' · ' + payload.connectionId + ' · ' + payload.method + ' 返回：\n' + payload.result);
          } else {
            showInvokeResult(true, '✓ ' + r.text);
          }
        } else {
          showInvokeResult(false, explain(r.status));
        }
      })
      .catch(function () {
        showInvokeResult(false, '调用失败：无法连接服务端。');
      });
  }

  function showBanner(text) {
    bannerEl.textContent = text;
    bannerEl.classList.add('show');
  }

  function clearBanner() {
    bannerEl.classList.remove('show');
  }

  function fetchStatus() {
    return fetch('/api/status', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (res) {
        if (res.status === 401) {
          showBanner('未通过鉴权：请刷新页面并在浏览器弹框中输入密码。');
          return null;
        }
        if (!res.ok) {
          showBanner('读取失败：HTTP ' + res.status);
          return null;
        }
        return res.json();
      })
      .then(function (data) {
        if (!data) return;
        clearBanner();
        items = Array.isArray(data.items) ? data.items : [];
        totalEl.textContent = typeof data.total === 'number' ? data.total : items.length;
        updatedEl.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
        renderRows();
      })
      .catch(function () {
        showBanner('读取失败：无法连接服务端。');
      });
  }

  function fetchDevices() {
    return fetch('/api/devices', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) return null;   // 鉴权/网络问题已由 fetchStatus 的横幅提示，这里静默
        return res.json();
      })
      .then(function (data) {
        if (!data) return;
        devices = Array.isArray(data.items) ? data.items : [];
        renderDevices();
        syncPanel();
      })
      .catch(function () { /* 静默：状态区已有横幅 */ });
  }

  function refreshAll() {
    fetchStatus();
    fetchDevices();
  }

  document.getElementById('refresh').addEventListener('click', refreshAll);
  document.getElementById('invoke').addEventListener('click', invoke);
  invDeviceEl.addEventListener('change', function () { syncMethods(invDeviceEl.value); });
  invPayloadEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') invoke();
  });

  refreshAll();
  setInterval(refreshAll, 5000);    // 每 5 秒重新拉取
  setInterval(renderRows, 1000);    // 时长每秒本地递增
})();
</script>
</body>
</html>
